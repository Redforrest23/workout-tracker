<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F1419">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">
    <title>Workout Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><rect width='180' height='180' fill='%230F1419'/><text x='50%' y='50%' font-size='80' text-anchor='middle' dominant-baseline='middle' fill='%235B8DB8'>💪</text></svg>">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg:          #0F0D08;
            --surface:     #1C1910;
            --raised:      #242018;
            --border:      #352E1E;
            --accent:      #D4802A;
            --accent-lt:   #E89A50;
            --success:     #6B9E5A;
            --success-bg:  #0C1A09;
            --danger:      #B05050;
            --hard-accent: #E05040;
            --hard-bg:     #1E0F0F;
            --hard-border: #3A1818;
            --txt:         #EDE0CC;
            --txt-sub:     #8A7A60;
            --txt-muted:   #524838;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
        }

        /* ── Auth ──────────────────────────────────────────── */
        .auth-screen {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .auth-container {
            background: var(--surface); border-radius: 16px;
            padding: 32px 28px; width: 100%; max-width: 380px;
            border: 1px solid var(--border);
        }
        .auth-title { font-size: 26px; font-weight: 700; color: var(--accent-lt); margin-bottom: 6px; text-align: center; }
        .auth-subtitle { font-size: 13px; color: var(--txt-muted); margin-bottom: 24px; text-align: center; }
        .auth-input {
            width: 100%; background: var(--raised); color: var(--txt);
            padding: 13px 15px; border-radius: 10px; font-size: 15px;
            border: 1px solid var(--border); margin-bottom: 12px; outline: none;
        }
        .auth-input:focus { border-color: var(--accent); }
        .auth-btn {
            width: 100%; background: var(--accent); padding: 13px; border-radius: 10px;
            border: none; color: #fff; font-weight: 700; font-size: 15px;
            cursor: pointer; margin-bottom: 10px;
        }
        .auth-btn:disabled { background: var(--raised); color: var(--txt-muted); cursor: not-allowed; }
        .auth-btn-secondary { background: var(--raised); color: var(--txt-sub); border: 1px solid var(--border); }
        .auth-error { color: #C47070; font-size: 13px; margin-top: 8px; text-align: center; }
        .auth-success { color: var(--success); font-size: 13px; margin-top: 8px; text-align: center; }
        .loading-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; font-size: 15px; color: var(--txt-muted); }

        /* ── Layout ────────────────────────────────────────── */
        .container { max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

        /* ── Header ────────────────────────────────────────── */
        .header { background: var(--surface); padding: 16px 16px 14px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .header-day { font-size: 22px; font-weight: 700; color: var(--txt); letter-spacing: -0.02em; }
        .header-date { font-size: 13px; color: var(--txt-sub); margin-top: 2px; }
        .header-email { font-size: 11px; color: var(--txt-muted); margin-top: 2px; }
        .refresh-btn {
            background: var(--raised); border: 1px solid var(--border); border-radius: 8px;
            width: 34px; height: 34px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 15px; color: var(--txt-muted); flex-shrink: 0;
        }
        .streak-chip {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
            background: var(--raised); border: 1px solid var(--border); border-radius: 20px;
            padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--accent-lt);
        }
        .streak-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

        /* ── Button row ────────────────────────────────────── */
        .btn-row {
            display: flex; gap: 8px; padding: 10px 14px;
            background: var(--bg); border-bottom: 1px solid var(--border);
        }
        .btn {
            padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border);
            font-size: 13px; font-weight: 600; cursor: pointer;
            background: var(--surface); color: var(--txt-sub);
        }
        .btn-danger { background: transparent; border-color: var(--danger); color: #C47070; margin-left: auto; }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── Workout list ──────────────────────────────────── */
        .workout-list { flex: 1; overflow-y: auto; padding: 12px; }
        .progress-wrap { margin-bottom: 14px; }
        /* The warm-up set sits above set 1 and reads as a lead-in, not a working set. */
        .rampup-row { opacity: 0.75; }
        .rampup-row .set-num { font-style: italic; }
        .progress-bar-bg { background: var(--raised); border-radius: 4px; height: 4px; overflow: hidden; margin-bottom: 5px; }
        .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }
        .progress-label { font-size: 11px; color: var(--txt-muted); text-align: right; }

        /* ── Cards ─────────────────────────────────────────── */
        .card { background: var(--surface); margin-bottom: 10px; border-radius: 14px; padding: 16px; border: 1px solid var(--border); }
        .card.hard-card { border-color: var(--hard-border); }
        .card.done-card { opacity: 0.45; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .ex-info { flex: 1; min-width: 0; }
        .ex-name { font-size: 17px; font-weight: 700; color: var(--txt); }
        .ex-name-done { color: var(--success); }
        .ex-cat { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--txt-muted); margin-top: 3px; }
        .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; margin-left: 12px; }
        .mode-toggle { display: flex; align-items: center; gap: 6px; }
        .mode-label { font-size: 12px; color: var(--txt-muted); }
        .mode-label-active { color: var(--txt); font-weight: 600; }
        .toggle-switch {
            width: 38px; height: 20px; background: var(--accent); border-radius: 10px;
            position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
        }
        .toggle-switch.on { background: var(--hard-accent); }
        .toggle-switch::after {
            content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%;
            background: #fff; top: 3px; left: 3px; transition: left 0.2s;
        }
        .toggle-switch.on::after { left: 21px; }
        .detail-btn {
            background: none; border: none; color: var(--txt-muted); font-size: 12px;
            cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 0;
        }
        .set-section { background: var(--raised); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
        .set-section.hard-section { background: var(--hard-bg); }
        .section-label { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
        .section-label.hard { color: var(--hard-accent); }
        .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
        .set-row:last-child { margin-bottom: 0; }
        .set-num { font-size: 13px; color: var(--txt-sub); width: 46px; flex-shrink: 0; }
        .set-input {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 10px; color: var(--txt); font-size: 14px; outline: none;
        }
        .set-input:focus { border-color: var(--accent); }
        .set-value { flex: 1; font-size: 14px; font-weight: 600; color: var(--success); }
        .complete-btn {
            width: 100%; padding: 13px; border-radius: 10px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer;
            background: var(--accent); color: #fff; letter-spacing: 0.01em;
        }
        .complete-btn:disabled { background: var(--raised); color: var(--txt-muted); cursor: not-allowed; }
        .complete-btn.hard { background: var(--hard-accent); }
        .done-check { color: var(--success); font-size: 18px; }

        /* ── Completed divider ─────────────────────────────── */
        .completed-divider { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
        .completed-divider::before, .completed-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .completed-divider-text { font-size: 11px; font-weight: 600; color: var(--success); letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap; }

        /* ── Center screens ────────────────────────────────── */
        .center-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 24px; text-align: center; }
        .center-title { font-size: 22px; font-weight: 700; color: var(--accent-lt); margin-bottom: 10px; }
        .center-text { font-size: 15px; color: var(--txt-sub); line-height: 24px; }

        /* ── Modal ─────────────────────────────────────────── */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.72); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--surface); border-radius: 16px; width: 92%; max-width: 520px;
            max-height: 86vh; border: 1px solid var(--border); display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--txt); }
        .modal-close { font-size: 15px; color: var(--accent); font-weight: 600; background: none; border: none; cursor: pointer; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
        .tab { flex: 1; padding: 11px; background: none; border: none; color: var(--txt-muted); font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--accent-lt); border-bottom-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .modal-scroll { flex: 1; overflow-y: auto; padding: 16px; }

        /* ── Settings ──────────────────────────────────────── */
        .settings-section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--txt-muted); margin-bottom: 8px; margin-top: 20px; }
        .settings-section-title:first-child { margin-top: 0; }
        .cat-count { font-size: 11px; color: var(--txt-muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
        .requires-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
                        color: var(--danger); border: 1px solid var(--hard-border); border-radius: 4px;
                        padding: 1px 5px; margin-left: 8px; white-space: nowrap; }
        .settings-row.archived { opacity: 0.55; }
        .settings-note { font-size: 12px; color: var(--txt-muted); font-style: italic; margin-bottom: 8px; }
        .cat-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 8px 0; user-select: none; }
        .cat-header-left { display: flex; align-items: center; gap: 8px; }
        .cat-arrow { font-size: 11px; color: var(--txt-muted); transition: transform 0.2s; }
        .cat-arrow.collapsed { transform: rotate(-90deg); }
        .cat-name { font-size: 14px; font-weight: 600; color: var(--txt); }
        .toggle-all-btn { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; color: var(--txt-muted); font-size: 12px; font-weight: 600; cursor: pointer; }
        .cat-exercises { overflow: hidden; max-height: 2000px; transition: max-height 0.25s ease; }
        .cat-exercises.collapsed { max-height: 0; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0 9px 20px; border-bottom: 1px solid var(--border); }
        .settings-row:last-child { border-bottom: none; }
        .settings-ex-name { font-size: 14px; color: var(--txt-sub); flex: 1; }
        .checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
        .track-toggle { display: flex; background: var(--raised); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
        .track-option { flex: 1; padding: 10px; background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--txt-muted); text-align: center; }
        .track-option.active { background: var(--accent); color: #fff; }
        .rest-day-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .rest-day-btn { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; color: var(--txt-sub); font-size: 13px; font-weight: 600; cursor: pointer; }
        .rest-day-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
        .info-box { background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .info-box-title { font-size: 14px; font-weight: 700; color: var(--txt); margin-bottom: 6px; }
        .info-box-text { font-size: 13px; color: var(--txt-sub); line-height: 20px; }

        /* ── History ───────────────────────────────────────── */
        .history-card { background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; cursor: pointer; }
        .history-date { font-size: 15px; font-weight: 700; color: var(--accent-lt); margin-bottom: 3px; }
        .history-type { font-size: 13px; color: var(--txt-sub); margin-bottom: 4px; }
        .history-count { font-size: 12px; color: var(--txt-muted); }
        .empty-msg { font-size: 14px; color: var(--txt-muted); text-align: center; margin-top: 24px; }

        /* ── Description modal ─────────────────────────────── */
        .desc-modal-inner {
            background: var(--surface); border-radius: 16px; padding: 22px;
            width: 88%; max-width: 420px; max-height: 75vh;
            border: 1px solid var(--border); overflow-y: auto;
        }
        .desc-name { font-size: 20px; font-weight: 700; color: var(--txt); margin-bottom: 12px; }
        .desc-text { font-size: 14px; color: var(--txt-sub); line-height: 22px; margin-bottom: 14px; }
        .desc-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        .desc-video-btn { background: var(--accent); color: #fff; }
        .desc-pdf-btn { background: var(--success); color: #fff; }
        .desc-close-btn { background: var(--raised); color: var(--txt-sub); border: 1px solid var(--border); }
        .pdf-note { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
        .pdf-note-label { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
        .pdf-note-page { font-size: 12px; color: var(--txt-sub); }

        @media (max-width: 480px) {
            .header-day { font-size: 20px; }
            .card { border-radius: 12px; }
        }

        /* ── Toast ─────────────────────────────────────────── */
        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: #2A0E0E; border: 1px solid var(--danger); color: #E08080;
            padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
            z-index: 9999; pointer-events: none; white-space: nowrap;
            animation: toast-in 0.2s ease;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(-50%) translateY(6px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://gnxwcdwqmderpghmtddy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdueHdjZHdxbWRlcnBnaG10ZGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NTQwODcsImV4cCI6MjA3NzAzMDA4N30.NCxKQvkvAuRlaAWR9FdYR9Or15qYyG2V69H-EeJU7pA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── Date helpers (always local, never UTC-shifted) ─────────────────────
    function toLocalDate(d = new Date()) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function parseLocalDate(str) {
        const [y, m, d] = str.split('-').map(Number);
        return new Date(y, m - 1, d);
    }
    // Sunday-anchored bounds of the week containing `d`, as local date strings.
    // Rest credits are scoped to this window and expire when it rolls over.
    function weekBounds(d = new Date()) {
        const start = new Date(d);
        start.setHours(0, 0, 0, 0);
        start.setDate(start.getDate() - start.getDay());
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        return [toLocalDate(start), toLocalDate(end)];
    }

    // Caches the in-progress workout for the day so a page reload restores it
    // instead of regenerating different random exercises. Cleared on workout complete.
    //
    // The cache is stamped with a hash of everything that decides what a session
    // contains. Keyed on the date alone, a workout generated before a deploy would
    // survive the rest of the day, so a change to the plan or the exercises did not
    // show up until tomorrow unless you knew to hit regenerate. A changed stamp
    // means the cached session was built by different rules, so it is discarded.
    // Computed on first use, not at load: WEEK_PLAN, SPLITS and DEFAULT_EXERCISES
    // are all declared below this point.
    let _buildStamp = null;
    const buildStamp = () => {
        if (_buildStamp === null) {
            const src = JSON.stringify([WEEK_PLAN, SPLITS, DEFAULT_EXERCISES]);
            let h = 5381;
            for (let i = 0; i < src.length; i++) h = (((h << 5) + h) ^ src.charCodeAt(i)) | 0;
            _buildStamp = (h >>> 0).toString(36);
        }
        return _buildStamp;
    };

    const saveWorkoutState = (workout, completedWorkout, log, hardMode) => {
        localStorage.setItem('currentWorkout', JSON.stringify({
            date: toLocalDate(),
            stamp: buildStamp(),
            workout, completedWorkout, log, hardMode
        }));
    };

    // ── Schedule helpers ───────────────────────────────────────────────────
    // Calves sit on Pull days rather than Legs days purely to even out session
    // length — they are quick, independent of everything else, and Legs days were
    // carrying five strength slots against Pull's two.
    const SPLITS = {
        // Core sits on Push days only. It used to run on Legs days too, which meant
        // the same hollow body hold four times a week — an artefact of both splits
        // carrying includeCore, not a decision. The loaded ab work on Pull days
        // covers that job better now.
        legs:     { name: 'Legs',     focus: ['squats', 'legAccessory', 'hinge'], includeCore: false, includeShoulder: false },
        push:     { name: 'Push',     focus: ['push'],                            includeCore: true,  includeShoulder: true  },
        pull:     { name: 'Pull',     focus: ['pull', 'row', 'abs'],             includeCore: false, includeShoulder: false },
        recovery: { name: 'Recovery', focus: [],                                  includeCore: false, includeShoulder: false },
    };

    // Days are assigned outright rather than derived from a rest day, because the
    // constraints are external to the training itself:
    //   - Tue/Thu classes start 45 min later, so the two longest sessions (Legs)
    //     go there. Sunday, also free, takes the third-longest.
    //   - Mon/Wed/Fri are the tight mornings, so they get the two shortest splits
    //     (Push) and the recovery day.
    //   - Pull needs a trip to the shared dorm pull-up bar and possibly a wait, so
    //     it sits on days with slack around them — Tue and Saturday.
    // Each split still lands twice a week with 3–4 days between repeats.
    // `apt` is the APT group that runs that day; 0 means stretches instead. Exactly
    // two days carry APT, which holds stretches at 5 days — the 10 sets a week the
    // stretch routine is built around.
    // `extra` appends slots to that day on top of its split. Rear delt and calves
    // need no equipment, so they moved off the Pull days and onto the two lightest
    // room days. That keeps the gym sessions to only what actually needs the gym —
    // the trip has its own overhead, including waiting for the bar — and uses up
    // the slack on Wed and Fri, which were the shortest days in the week.
    const WEEK_PLAN = [
        { type: 'legs',     apt: 0, extra: [] },                     // Sun — free day
        { type: 'push',     apt: 1, extra: [] },                     // Mon — tight morning
        { type: 'pull',     apt: 0, extra: [] },                     // Tue — gym, late start
        { type: 'recovery', apt: 2, extra: ['rearDelt', 'calf'] },   // Wed — tight morning, room
        { type: 'legs',     apt: 0, extra: [] },                     // Thu — late start
        { type: 'push',     apt: 0, extra: ['rearDelt', 'calf'] },   // Fri — tight morning, room
        { type: 'pull',     apt: 0, extra: [] },                     // Sat — gym, free day
    ];

    // Loaded or compound patterns, where going in cold actually carries a cost.
    // Only the FIRST of these in a session gets a warm-up set — once you are warm
    // the later slots do not need their own. The recovery day has none of these, so
    // it gets no warm-up set at all, which is right for a day of light corrective
    // work.
    const RAMP_UP_CATEGORIES = new Set(['squats', 'push', 'pull', 'pullDb', 'hinge']);
    const rampUpReps = (ex, isHard) => Math.max(1, Math.ceil((isHard ? ex.hardReps : ex.reps) / 2));

    // Shown against each exercise in the day's list. Anything not named here falls
    // back to the split name, so 'squats' reads as "Legs" and 'push' as "Push".
    const CATEGORY_LABELS = {
        rearDelt: 'Rear Delt', legAccessory: 'Legs', hinge: 'Hinge',

    // There is no full rest day. The recovery day drops strength work and runs

            { id:'p1', name:'Wall Push-ups',            difficulty:1, sets:3, reps:10, hardSets:4, hardReps:15, isTime:false, enabled:false, desc:'Stand facing wall. Hands at shoulder height. Lean in and push back. Keep body straight.', videoUrl:'https://www.hybridcalisthenics.com/wall-pushups' },
            { id:'p2', name:'Incline Push-ups',          difficulty:2, sets:3, reps:10, hardSets:4, hardReps:12, isTime:false, enabled:false, desc:'Hands on elevated surface. Lower chest, push up. Keep core tight and body in a straight line.', videoUrl:'https://www.hybridcalisthenics.com/incline-pushups' },
            { id:'p3', name:'Regular Push-ups',          difficulty:3, sets:3, reps:10, hardSets:4, hardReps:15, isTime:false, enabled:true,  desc:'Plank position. Lower chest to ground, elbows at 45°. Push back up. Maintain straight body line. WRISTS: press on your fists rather than flat palms — a folded towel or mat under the knuckles helps. Flat palms put the wrist in near-full extension under your bodyweight, which is the position to avoid with arthritis and carpal tunnel. Keep the forearm, wrist and knuckles in one straight line. Push-up handles or dumbbells stood on the floor do the same job if you get hold of some.', videoUrl:'https://www.hybridcalisthenics.com/full-pushups' },
            { id:'p4', name:'Diamond Push-ups',          difficulty:4, sets:3, reps:8,  hardSets:3, hardReps:12, isTime:false, enabled:false, desc:'Thumbs and index fingers form diamond. Keep elbows close. Heavily targets triceps.', videoUrl:'https://www.youtube.com/watch?v=kGhDnFwMY3E' },
            { id:'p5', name:'Decline Push-ups',          difficulty:5, sets:3, reps:10, hardSets:4, hardReps:12, isTime:false, enabled:false, desc:'Feet elevated. Hands on ground. Harder than regular, emphasizes upper chest.', videoUrl:'https://www.youtube.com/watch?v=s5dEc154cCc' },

        pull: [
            { id:'pu9',  name:'Dead Hang',      difficulty:1, sets:3, reps:20, hardSets:3, hardReps:40, isTime:true,  enabled:true,  desc:'Hang from the high bar, hands shoulder-width, arms straight. Shoulders stay active rather than fully slack — think of pulling them down away from your ears without bending the elbows. Hold for time, feet off the floor or lightly touching if you need to scale it. This builds the grip and shoulder tolerance that every pull-up progression is gated behind, and grip endurance is the thing that limits climbers more than pulling strength. The wrist is neutral and under traction here rather than compression, which is about the kindest loaded position available to you — but stop if you get numbness or tingling. Move to scapular pulls once you can hold a comfortable 30 seconds.', videoUrl:null },
            { id:'pu10', name:'Scapular Pulls', difficulty:2, sets:3, reps:8,  hardSets:3, hardReps:12, isTime:false, enabled:false, desc:'From a dead hang with straight arms, pull your shoulder blades down and back to lift your body a few inches — no elbow bend at all. Pause at the top, lower under control. Tiny range, and it teaches the scapular engagement that starts every real pull-up. Skipping this is why people stall on negatives with their shoulders shrugged up around their ears.', videoUrl:null },
            { id:'pu1', name:'Wall Pull-ups',       difficulty:1, sets:3, reps:8,  hardSets:3, hardReps:12, isTime:false, enabled:false, desc:'SUPERSEDED — this existed only because there was no bar to hang from. A dead hang on the real bar is a better starting point and transfers to actual pull-ups; a wall lean does not load the pattern much at all. Kept for reference. Face wall, hands overhead. Walk feet forward, lean back. Pull toward wall using your back.', videoUrl:'https://www.youtube.com/watch?v=rYXoCAxIJgs' },
            { id:'pu2', name:'Australian Pull-ups', requires:'Low bar', difficulty:2, sets:3, reps:8,  hardSets:4, hardReps:12, isTime:false, enabled:false, desc:'NEEDS A LOW BAR (waist height) or rings — not doable on the high dorm bar. Hang underneath, body straight, heels on the floor. Pull chest to bar. Lower with control. A sturdy desk or table edge is the usual substitute: lie underneath and row up to it.', videoUrl:'https://www.hybridcalisthenics.com/pullups' },
            { id:'pu3', name:'Negative Pull-ups',   difficulty:3, sets:3, reps:5,  hardSets:3, hardReps:8,  isTime:false, enabled:false, desc:'Works on a high bar, so this is the rung to start on. Jump or step up to the top position with your chin over the bar, then lower as slowly as you can — aim for 5–10 seconds. The lowering half is where the strength is built, and you can do it long before you can pull yourself up. Grip is neutral here, which suits the wrists. Start with 3–5 reps; stop the set when the lowering stops being slow.', videoUrl:'https://www.hybridcalisthenics.com/pullups' },
            { id:'pu4', name:'Assisted Pull-ups',   difficulty:4, sets:3, reps:6,  hardSets:3, hardReps:10, isTime:false, enabled:false, desc:'No band needed — put a chair or box under the bar and take just enough weight through one foot to complete the rep, driving with the back rather than the leg. Reduce the help as you get stronger. Pull chin over bar, lower under control.', videoUrl:'https://www.hybridcalisthenics.com/pullups' },
            { id:'pu5', name:'Regular Pull-ups',    difficulty:5, sets:3, reps:5,  hardSets:4, hardReps:8,  isTime:false, enabled:false, desc:'Hang from bar, palms away. Pull chin over bar. Lower controlled. Engage core.', videoUrl:'https://www.hybridcalisthenics.com/pullups' },
            { id:'pu6', name:'Chin-ups',            difficulty:5, sets:3, reps:6,  hardSets:4, hardReps:10, isTime:false, enabled:false, desc:'Palms facing you. More bicep involvement. Pull chin over bar.', videoUrl:'https://www.hybridcalisthenics.com/pullups' },

            { id:'rdb1', name:'Prone Y-T-W Raises',     difficulty:1, sets:3, reps:10, hardSets:3, hardReps:15, isTime:false, enabled:true,  desc:'Lie face down, forehead resting on the floor, arms straight and thumbs pointing up. Lift the arms off the floor in three shapes — overhead in a Y, straight out to the sides in a T, elbows bent in a W — squeezing the shoulder blades down and back each time. 10 of each shape, no weight. Low load and high control; this trains rear delt plus mid and lower trap, the muscles that pull your shoulders back out of the forward position that comes with rib flare.', videoUrl:null, pdfUrl:null, pdfPage:null },
            { id:'rdb2', name:'Wide-Grip Inverted Row', requires:'Low bar', difficulty:2, sets:3, reps:10, hardSets:4, hardReps:12, isTime:false, enabled:false, desc:'NEEDS A LOW BAR (waist height), rings, or a sturdy desk edge — not the high dorm bar. Hang underneath it with your hands wider than shoulder-width, body straight, heels on the floor. Pull your chest to the bar with your elbows flared out to roughly 90° — wide elbows are what shift the work off the lats and onto the rear delts and mid-traps. Lower under control. Harder: walk your feet further forward, or elevate them on a chair.', videoUrl:null, pdfUrl:null, pdfPage:null },
            { id:'rdb3', name:'Inverted Face Pull', requires:'Low bar',     difficulty:3, sets:3, reps:8,  hardSets:3, hardReps:12, isTime:false, enabled:false, desc:'NEEDS A LOW BAR, same as the wide-grip inverted row. Same setup, but pull toward your forehead instead of your chest, keeping the elbows high and wide and finishing with your hands beside your ears. The most rear-delt-specific pull you can do without weight, and it trains external rotation directly. The range is short — go slow and hold the top for a beat rather than chasing reps.', videoUrl:null, pdfUrl:null, pdfPage:null },

            { id:'rd3', name:'Incline Rear Delt Fly',  difficulty:3, sets:3, reps:12, hardSets:3, hardReps:15, isTime:false, enabled:false, desc:'Set bench to ~30° incline. Lie chest-down. Arms hang. Raise out to sides, leading with elbows. The incline eliminates hip drive and trunk momentum, isolating rear delt and mid-traps more than the bent-over version. 8–15 lbs.', videoUrl:'https://www.youtube.com/watch?v=buuYPLVXsJg' },

            { id:'oh1', name:'Pike Push-ups',           difficulty:1, sets:3, reps:8,  hardSets:3, hardReps:12, isTime:false, enabled:false, desc:'Start in downward-dog position (hips high, inverted V). Bend elbows to bring the top of your head toward the floor, press back up. This is bodyweight overhead pressing — it trains the front and side deltoids and builds the pattern for handstand push-ups. No equipment, zero load on the subclavian region. DISABLED pending physical therapy: more of your bodyweight sits over the hands than in a push-up, and the wrist is in near-full extension throughout — the worst position in this program for wrist arthritis and carpal tunnel. Fists do not work well here because of the balance demand. Note the bind: this was the overhead option BECAUSE it puts no load through the subclavian region, and the dumbbell press below is the one your thoracic outlet history argues against. There is currently no overhead press that clears both constraints, so the slot is empty until a therapist sorts out which risk is the smaller one.', videoUrl:'https://www.youtube.com/watch?v=s_aK83TWYkA' },

            { id:'oh3', name:'Arnold Press',            difficulty:3, sets:3, reps:8,  hardSets:3, hardReps:10, isTime:false, enabled:false, desc:'Start with dumbbells in front of you, palms facing you (as if finishing a curl). As you press up, rotate palms forward. Reverse on the way down. Hits all three deltoid heads through a larger range of motion than standard press. 12–20 lbs. Named after Arnold Schwarzenegger.', videoUrl:'https://www.youtube.com/watch?v=Did01dFR3Lk' },
