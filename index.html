    // ── Auth component ─────────────────────────────────────────────────────
    function AuthScreen() {
        const [isSignUp, setIsSignUp] = useState(false);
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [loading, setLoading] = useState(false);
        const [message, setMessage] = useState('');
        const [error, setError] = useState('');

        const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true); setError(''); setMessage('');
            if (isSignUp) {
                const { error } = await supabase.auth.signUp({ email, password });
                setLoading(false);
                if (error) setError(error.message);
                else setMessage('Check your email to confirm your account!');
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                setLoading(false);
                if (error) setError(error.message);
            }
        };

        return (
            <div className="auth-screen">
                <div className="auth-container">
                    <div className="auth-title">Workout Tracker</div>
                    <div className="auth-subtitle">{isSignUp ? 'Create your account' : 'Sign in to your account'}</div>
                    <form onSubmit={handleSubmit}>
                        <input type="email" className="auth-input" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required autoFocus />
                        <input type="password" className="auth-input" placeholder="Password (min 6 characters)" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} />
                        <button type="submit" className="auth-btn" disabled={loading}>
                            {loading ? 'Loading…' : (isSignUp ? 'Sign Up' : 'Sign In')}
                        </button>
                    </form>
                    <button className="auth-btn auth-btn-secondary" onClick={() => { setIsSignUp(!isSignUp); setError(''); setMessage(''); }}>
                        {isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up'}
                    </button>
                    {message && <div className="auth-success">{message}</div>}
                    {error   && <div className="auth-error">{error}</div>}
                </div>
            </div>
        );
    }

    // ── Main App ───────────────────────────────────────────────────────────
    function App() {
        const [user, setUser]                         = useState(null);
        const [loading, setLoading]                   = useState(true);
        const [exercises, setExercises]               = useState(DEFAULT_EXERCISES);
        const [workout, setWorkout]                   = useState([]);
        const [completedWorkout, setCompletedWorkout] = useState([]);
        const [log, setLog]                           = useState({});
        const [hardMode, setHardMode]                 = useState({});
        const [showSettings, setShowSettings]         = useState(false);
        const [activeTab, setActiveTab]               = useState('exercises');
        const [showDesc, setShowDesc]                 = useState(false);
        const [showHistory, setShowHistory]           = useState(false);
        const [selectedEx, setSelectedEx]             = useState(null);
        const [date, setDate]                         = useState('');
        const [dayName, setDayName]                   = useState('');
        const [isRest, setIsRest]                     = useState(false);
        const [streak, setStreak]                     = useState(0);
        const [history, setHistory]                   = useState([]);
        const [stretchIndex, setStretchIndex]         = useState(0);
        const [viewingHistory, setViewingHistory]     = useState(null);
        const [showHistoryDetail, setShowHistoryDetail] = useState(false);
        const [workoutComplete, setWorkoutComplete]   = useState(false);
        const [restCredits, setRestCredits]           = useState(0);
        const [restSpentDates, setRestSpentDates]     = useState([]);
        const [collapsed, setCollapsed]               = useState({});
        const [toast, setToast]                       = useState(null);

        const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(null), 4000);
        };

        useEffect(() => {
            checkUser();
            const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
                setUser(session?.user ?? null);
                if (session?.user) loadData(session.user.id);
            });
            return () => listener.subscription.unsubscribe();
        }, []);

        useEffect(() => {
            if (user && workout.length === 0 && completedWorkout.length > 0 && !workoutComplete) {
                saveWorkoutToHistory();
            }
        }, [workout, completedWorkout, workoutComplete]);

        const checkUser = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            setUser(session?.user ?? null);
            if (session?.user) await loadData(session.user.id);
            setLoading(false);
        };

        const loadData = async (uid) => {
            try {
                const { data: settingsData } = await supabase
                    .from('exercise_settings').select('exercise_data').eq('user_id', uid).single();

                // Content — names, cues, sets, reps, videos — always comes from the
                // defaults. `enabled` is the only per-exercise field the UI can
                // change, so it is the only thing carried over from a saved copy.
                // Returning the saved objects instead (the previous behaviour) froze
                // every description at whatever it said when the account first saved,
                // and silently kept exercises that had since been removed.
                const mergeArr = (saved, defaults) => {
                    if (!saved) return defaults;
                    const savedEnabled = new Map(saved.map(e => [e.id, e.enabled]));
                    return defaults.map(e =>
                        savedEnabled.has(e.id) ? { ...e, enabled: savedEnabled.get(e.id) } : e
                    );
                };

                let exData = DEFAULT_EXERCISES;
                if (settingsData) {
                    const saved = settingsData.exercise_data;
                    exData = {
                        ...DEFAULT_EXERCISES,
                        ...saved,
                        mandatory:    mergeArr(saved.mandatory,    DEFAULT_EXERCISES.mandatory),
                        push:         mergeArr(saved.push,         DEFAULT_EXERCISES.push),
                        pull:         mergeArr(saved.pull,         DEFAULT_EXERCISES.pull),
                        pullDb:       mergeArr(saved.pullDb,       DEFAULT_EXERCISES.pullDb),
                        core:         mergeArr(saved.core,         DEFAULT_EXERCISES.core),
                        squats:       mergeArr(saved.squats,       DEFAULT_EXERCISES.squats),
                        apt:          mergeArr(saved.apt,          DEFAULT_EXERCISES.apt),
                        hinge:        mergeArr(saved.hinge,        DEFAULT_EXERCISES.hinge),
                        abs:          mergeArr(saved.abs,          DEFAULT_EXERCISES.abs),
                        calf:         mergeArr(saved.calf,         DEFAULT_EXERCISES.calf),
                        overhead:     mergeArr(saved.overhead,     DEFAULT_EXERCISES.overhead),
                        rearDelt:     mergeArr(saved.rearDelt,     DEFAULT_EXERCISES.rearDelt),
                        rearDeltBw:   mergeArr(saved.rearDeltBw,   DEFAULT_EXERCISES.rearDeltBw),
                        legAccessory: mergeArr(saved.legAccessory, DEFAULT_EXERCISES.legAccessory),
                        // Merge each stretch sub-category by id, so stretches added to
                        // the defaults later still show up for an existing account
                        // instead of being masked by the saved copy.
                        stretches: (() => {
                            const s = saved.stretches;
                            if (!s) return DEFAULT_EXERCISES.stretches;
                            const out = { ...DEFAULT_EXERCISES.stretches, ...s };
                            for (const sub of Object.keys(DEFAULT_EXERCISES.stretches)) {
                                out[sub] = mergeArr(s[sub], DEFAULT_EXERCISES.stretches[sub]);
                            }
                            return out;
                        })(),
                    };

                    // One-time settings upgrade. Retired exercises would otherwise
                    // stay enabled because mergeArr keeps the saved copy of any id
                    // it already knows.
                    if (saved.settingsVersion !== SETTINGS_VERSION) {
                        RESET_ON_UPGRADE.forEach(cat => {
                            const defaultEnabled = new Map(DEFAULT_EXERCISES[cat].map(e => [e.id, e.enabled]));
                            exData[cat] = exData[cat].map(e =>
                                defaultEnabled.has(e.id) ? { ...e, enabled: defaultEnabled.get(e.id) } : e
                            );
                        });
                        exData.settingsVersion = SETTINGS_VERSION;
                        const upgradeError = await saveExerciseSettings(exData, uid);
                        if (upgradeError) console.error('settings upgrade did not persist:', upgradeError);
                    }
                }
                setExercises(exData);

                // user_profiles.custom_rest_day is no longer read: the week is laid
                // out explicitly in WEEK_PLAN rather than derived from a rest day.

                const todayStr = toLocalDate();
                const d = new Date();
                const dayOfWeek = d.getDay();

                // Every day trains something now, so the week grants one rest credit
                // outright instead of banking one when a scheduled rest day is
                // traded away. Each row in rest_day_postponements is a day taken as
                // a full rest; unspent credits expire when the week rolls over.
                // Fetched unbounded, not just this week: the streak has to know about
                // every past rest day, or one taken weeks ago starts breaking it.
                // Only this week's rows count against the credit.
                const [weekStart, weekEnd] = weekBounds(d);
                const { data: restRows } = await supabase
                    .from('rest_day_postponements')
                    .select('postponed_date').eq('user_id', uid);
                const spentDates = (restRows || []).map(r => r.postponed_date);
                const spentThisWeek = spentDates.filter(ds => ds >= weekStart && ds <= weekEnd);
                setRestSpentDates(spentDates);
                setRestCredits(Math.max(0, REST_CREDITS_PER_WEEK - spentThisWeek.length));

                const restedToday = spentDates.includes(todayStr);

                const { data: historyData } = await supabase
                    .from('workout_history').select('*').eq('user_id', uid).order('date', { ascending: false });
                const hist = historyData || [];
                setHistory(hist);
                calculateStreak(hist, spentDates);

                const { data: stretchData } = await supabase
                    .from('stretch_categories').select('last_categories').eq('user_id', uid).single();
                let si = 0;
                if (stretchData && typeof stretchData.last_categories === 'number') {
                    si = stretchData.last_categories;
                }
                setStretchIndex(si);

                setDate(d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }));

                // The only way to get a full day off now is to spend a rest credit.
                // Every other day trains something, the recovery day included.
                const isRestDay = restedToday;
                setIsRest(isRestDay);

                if (isRestDay) {
                    setDayName('Rest');
                } else {
                    const schedule = getWorkoutSchedule(dayOfWeek);
                    setDayName(schedule.name);
                    const alreadyDone = hist.some(h => h.date === todayStr);
                    if (!alreadyDone) {
                        const saved = localStorage.getItem('currentWorkout');
                        let restored = false;
                        if (saved) {
                            try {
                                const parsed = JSON.parse(saved);
                                // A missing or stale stamp means the session was built
                                // before a deploy changed the rules — regenerate.
                                if (parsed.date === todayStr && parsed.stamp === buildStamp() && parsed.workout?.length > 0) {
                                    setWorkout(parsed.workout);
                                    setCompletedWorkout(parsed.completedWorkout || []);
                                    setLog(parsed.log || {});
                                    setHardMode(parsed.hardMode || {});
                                    setWorkoutComplete(false);
                                    restored = true;
                                }
                            } catch (e) { /* fall through to generate */ }
                        }
                        if (!restored) generateWorkoutWith(dayOfWeek, exData, si, uid);
                    } else {
                        setWorkoutComplete(true);
                    }
                }
            } catch (err) {
                console.error('loadData error:', err);
            }
        };

        const calculateStreak = (hist, spentDates = restSpentDates) => {
            if (!hist || hist.length === 0) { setStreak(0); return; }
            const todayStr = toLocalDate();
            const hasTodayWorkout = hist.some(h => h.date === todayStr);

            let count = 0;
            const check = new Date();
            check.setHours(0, 0, 0, 0);
            if (!hasTodayWorkout) check.setDate(check.getDate() - 1);

            while (count <= 365) {
                const ds = toLocalDate(check);
                // Only a day taken off with a rest credit is skipped. The recovery
                // day is a training day now, so it counts like any other.
                if (spentDates.includes(ds)) { check.setDate(check.getDate() - 1); continue; }
                if (hist.some(h => h.date === ds)) {
                    count++;
                    check.setDate(check.getDate() - 1);
                } else {
                    break;
                }
            }
            setStreak(count);
        };

        const generateWorkout = () => {
            if (workout.length > 0 && !window.confirm('Regenerate workout? Your current progress will be lost.')) return;
            const d = new Date();
            generateWorkoutWith(d.getDay(), exercises, stretchIndex, user?.id);
        };

        const generateWorkoutWith = (dayOfWeek, exData, si, uid) => {
            const schedule = getWorkoutSchedule(dayOfWeek);
            const items = [];

            // All mandatory exercises every session — consistent warm-up and wrist prep
            exData.mandatory.filter(e => e.enabled).forEach(e => items.push({ ...e, category: 'Warm-Up' }));

            // Main lift(s), plus any equipment-free slots this day picks up
            [...schedule.focus, ...(WEEK_PLAN[dayOfWeek].extra || [])].forEach(cat => {
                let pool;
                if (cat === 'pull') {
                    pool = (exData.pullTrack === 'dumbbells' ? exData.pullDb : exData.pull).filter(e => e.enabled);
                } else if (cat === 'row') {
                    // Horizontal pull, the one movement pattern the week was missing
                    // entirely. Reuses the dumbbell pull list rather than duplicating
                    // it, and is skipped when the pull track is already dumbbells —
                    // the main pull is a row in that case and this would repeat it.
                    if (exData.pullTrack === 'dumbbells') return;
                    pool = (exData.pullDb || []).filter(e => e.enabled);
                } else if (cat === 'rearDelt') {
                    // Rear delt follows the pull track too — the dumbbell flys are
                    // not a sensible pairing with a bodyweight pull-up progression.
                    pool = ((exData.pullTrack === 'dumbbells' ? exData.rearDelt : exData.rearDeltBw) || []).filter(e => e.enabled);
                } else {
                    pool = (exData[cat] || []).filter(e => e.enabled);
                }
                const catLabel = CATEGORY_LABELS[cat] || schedule.name;
                if (pool.length > 0) items.push({ ...pool[0], category: catLabel, slot: cat });
            });

            // Overhead press on Push days (compound — before core)
            if (schedule.includeShoulder) {
                const pool = (exData.overhead || []).filter(e => e.enabled);
                if (pool.length > 0) items.push({ ...pool[0], category: 'Shoulders' });
            }

            // Core on Push and Legs days (isolation/endurance — after all strength work)
            if (schedule.includeCore) {
                const pool = exData.core.filter(e => e.enabled);
                if (pool.length > 0) items.push({ ...pool[0], category: 'Core' });
            }

            // APT on the two APT days, split into two fixed groups rather than drawn
            // at random. The pool is sized to the weekly slots, so randomising only
            // made the day unpredictable without changing what you do over a week.
            // Group 2 runs on the recovery day, group 1 on the other; anything
            // without a group falls into group 1.
            const aptGroup = aptGroupFor(dayOfWeek);
            if (aptGroup > 0) {
                exData.apt
                    .filter(e => e.enabled && (e.aptGroup || 1) === aptGroup)
                    .forEach(e => items.push({ ...e, category: 'APT' }));
            }

            // Stretches on the five non-APT days. 5 days x 2 sets is the 10 sets a
            // week the routine is built around, so this deliberately does not run
            // every day — the APT days are the two that go without.
            if (isStretchDay(dayOfWeek)) {
                (exData.stretches.daily || [])
                    .filter(e => e.enabled)
                    .forEach(e => items.push({ ...e, category: 'Stretch' }));
            }

            // First loaded movement of the session carries the warm-up set.
            const rampIdx = items.findIndex(e => RAMP_UP_CATEGORIES.has(e.slot));
            if (rampIdx >= 0) items[rampIdx] = { ...items[rampIdx], rampUp: true };

            setWorkout(items);
            setCompletedWorkout([]);
            setLog({});
            setHardMode({});
            setWorkoutComplete(false);
            saveWorkoutState(items, [], {}, {});
        };

        const saveStretchIndex = async (idx, uid) => {
            const id = uid || user?.id;
            if (!id) return;
            const { data: ex } = await supabase.from('stretch_categories').select('id').eq('user_id', id).single();
            let error;
            if (ex) {
                ({ error } = await supabase.from('stretch_categories').update({ last_categories: idx, updated_at: new Date().toISOString() }).eq('user_id', id));
            } else {
                ({ error } = await supabase.from('stretch_categories').insert({ user_id: id, last_categories: idx }));
            }
            if (error) { console.error('saveStretchIndex error:', error); showToast('Sync error — stretch rotation may repeat'); }
        };

        const saveExerciseSettings = async (data, uid) => {
            const id = uid || user?.id;
            if (!id) return;
            const { data: ex } = await supabase.from('exercise_settings').select('id').eq('user_id', id).single();
            let error;
            if (ex) {
                ({ error } = await supabase.from('exercise_settings').update({ exercise_data: data, updated_at: new Date().toISOString() }).eq('user_id', id));
            } else {
                ({ error } = await supabase.from('exercise_settings').insert({ user_id: id, exercise_data: data }));
            }
            if (error) console.error('saveExerciseSettings error:', error);
            return error || null;
        };

        const saveWorkoutToHistory = async () => {
            if (!user) return;
            try {
                const todayStr = toLocalDate();
                const payload = {
                    user_id: user.id,
                    date: todayStr,
                    workout_type: dayName,
                    exercises: [...workout, ...completedWorkout].map(ex => {
                        const isHard = hardMode[ex.id];
                        const prefix = isHard ? 'hard' : 'reg';
                        const numSets = isHard ? ex.hardSets : ex.sets;
                        return {
                            ...ex, isHard,
                            loggedSets: Array.from({ length: numSets }, (_, i) => log[`${ex.id}-${prefix}-${i}`] || '0'),
                        };
                    }),
                };
                const { data, error } = await supabase.from('workout_history').insert(payload).select().single();
                if (error) throw error;
                const updated = [data, ...history];
                setHistory(updated);
                calculateStreak(updated);
                setWorkoutComplete(true);
                localStorage.removeItem('currentWorkout');
            } catch (err) {
                console.error('saveWorkoutToHistory error:', err);
                showToast('Failed to save workout — check your connection and try again');
            }
        };


        const toggleEx = async (category, id) => {
            const prev = exercises;
            const updated = JSON.parse(JSON.stringify(exercises));
            if (category === 'stretches') {
                for (const sub of Object.keys(updated.stretches)) {
                    const ex = updated.stretches[sub].find(e => e.id === id);
                    if (ex) { ex.enabled = !ex.enabled; break; }
                }
            } else {
                const ex = updated[category]?.find(e => e.id === id);
                if (ex) ex.enabled = !ex.enabled;
            }
            setExercises(updated);
            const error = await saveExerciseSettings(updated);
            if (error) setExercises(prev);
        };

        const toggleAllInCategory = async (category, sub = null) => {
            const prev = exercises;
            const updated = JSON.parse(JSON.stringify(exercises));
            const list = sub ? updated.stretches[sub] : updated[category];
            const allOn = list.every(e => e.enabled);
            list.forEach(e => { e.enabled = !allOn; });
            setExercises(updated);
            const error = await saveExerciseSettings(updated);
            if (error) setExercises(prev);
        };

        const changePullTrack = async (track) => {
            const updated = { ...exercises, pullTrack: track };
            setExercises(updated);
            await saveExerciseSettings(updated);
        };


        // Spend this week's rest credit to take a full day off.
        const spendRestDay = async () => {
            if (!user || restCredits < 1) return;
            if (window.confirm("Take a full rest day today? Your streak stays intact.")) {
                const { error } = await supabase.from('rest_day_postponements').insert({ user_id: user.id, postponed_date: toLocalDate() });
                if (error) { console.error('spendRestDay error:', error); showToast('Could not take rest day — try again'); return; }
                localStorage.removeItem('currentWorkout');
                window.location.reload();
            }
        };

        const logRep = (id, key, value) => setLog(prev => {
            const next = { ...prev, [`${id}-${key}`]: value };
            saveWorkoutState(workout, completedWorkout, next, hardMode);
            return next;
        });
        const toggleHardMode = (id) => setHardMode(prev => {
            const next = { ...prev, [id]: !prev[id] };
            saveWorkoutState(workout, completedWorkout, log, next);
            return next;
        });
        const toggleCollapsed = (key) => setCollapsed(prev => ({ ...prev, [key]: !prev[key] }));

        const isComplete = (ex) => {
            const isHard = hardMode[ex.id];
            const numSets = isHard ? ex.hardSets : ex.sets;
            const prefix = isHard ? 'hard' : 'reg';
            if (ex.rampUp && !log[`${ex.id}-${prefix}-w`]?.trim()) return false;
            for (let i = 0; i < numSets; i++) {
                if (!log[`${ex.id}-${prefix}-${i}`]?.trim()) return false;
            }
            return true;
        };

        const completeExercise = (ex) => {
            const nextWorkout = workout.filter(e => e.id !== ex.id);
            const nextCompleted = [...completedWorkout, ex];
            setWorkout(nextWorkout);
            setCompletedWorkout(nextCompleted);
            saveWorkoutState(nextWorkout, nextCompleted, log, hardMode);
        };

        const handleLogout = async () => { await supabase.auth.signOut(); setUser(null); };

        if (loading) return <div className="loading-screen">Loading…</div>;
        if (!user)   return <AuthScreen />;

        // ── Modals ─────────────────────────────────────────────────────────
        // `opts.archive` renders a section read-only: no checkboxes, no Toggle All,
        // collapsed by default. Nothing in an archived category can reach a
        // generated workout, so live controls there only invited ticking a box that
        // would never do anything. `requires` surfaces missing equipment in the row
        // itself rather than burying it in the description.
        const renderExerciseSection = (label, category, sub = null, note = null, opts = {}) => {
            const key = sub || category;
            const list = (sub ? exercises.stretches[sub] : exercises[category]) || [];
            const isCollapsed = key in collapsed ? collapsed[key] : !!opts.archive;
            const onCount = list.filter(e => e.enabled).length;
            return (
                <div key={key}>
                    <div className="cat-header" onClick={() => toggleCollapsed(key)}>
                        <div className="cat-header-left">
                            <span className={`cat-arrow ${isCollapsed ? 'collapsed' : ''}`}>▼</span>
                            <span className="cat-name">{label}</span>
                            {!opts.archive && <span className="cat-count">{onCount}/{list.length}</span>}
                        </div>
                        {!opts.archive && (
                            <button className="toggle-all-btn" onClick={e => { e.stopPropagation(); toggleAllInCategory(category, sub); }}>Toggle All</button>
                        )}
                    </div>
                    {note && <div className="settings-note">{note}</div>}
                    <div className={`cat-exercises ${isCollapsed ? 'collapsed' : ''}`}>
                        {list.map(ex => (
                            <div key={ex.id} className={opts.archive ? 'settings-row archived' : 'settings-row'}>
                                <span className="settings-ex-name">
                                    {ex.name}
                                    {ex.requires && <span className="requires-tag">no {ex.requires}</span>}
                                </span>
                                {!opts.archive && (
                                    <input type="checkbox" className="checkbox" checked={ex.enabled} onChange={() => toggleEx(category, ex.id)} />
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const modals = (
            <>
                {toast && <div className="toast">{toast}</div>}
                {/* Settings */}
                <div className={`modal ${showSettings ? 'show' : ''}`}>
                    <div className="modal-content" style={{ height: '86vh' }}>
                        <div className="modal-header">
                            <span className="modal-title">Settings</span>
                            <button className="modal-close" onClick={() => setShowSettings(false)}>Done</button>
                        </div>
                        <div className="tabs">
                            {['exercises','schedule','about'].map(t => (
                                <button key={t} className={`tab ${activeTab === t ? 'active' : ''}`} onClick={() => setActiveTab(t)}>
                                    {t.charAt(0).toUpperCase() + t.slice(1)}
                                </button>
                            ))}
                        </div>
                        <div className="modal-scroll">
                            <div className={`tab-content ${activeTab === 'exercises' ? 'active' : ''}`}>
                                <div className="settings-section-title">Every Day — Stretches</div>
                                {renderExerciseSection('Daily Stretch Routine', 'stretches', 'daily', 'Runs on the five non-APT days, 2 sets each — 10 sets a week per stretch')}

                                <div className="settings-section-title">Legs Days — Sun / Thu</div>
                                {renderExerciseSection('Squat', 'squats')}
                                {renderExerciseSection('Adductors', 'legAccessory', null, 'Copenhagen plank — adductor work nothing else covers')}
                                {renderExerciseSection('Hip Hinge', 'hinge', null, 'Hamstrings and glutes, balancing the quad-dominant squat')}

                                <div className="settings-section-title">Push Days — Mon / Fri</div>
                                {renderExerciseSection('Push', 'push')}
                                {renderExerciseSection('Core', 'core', null, 'Isometric anti-extension holds for posture — the loaded ab work is under Pull days')}

                                <div className="settings-section-title">Pull Days — Tue / Sat (dorm gym)</div>
                                {renderExerciseSection('Pull-ups', 'pull', null, 'Vertical pull on the high bar')}
                                {renderExerciseSection('Rows', 'pullDb', null, 'Horizontal pull — dumbbell and bench. Becomes the main pull instead if Pull Track is switched to Dumbbells')}
                                {renderExerciseSection('Abs', 'abs', null, 'Loaded and progressive, at the captain\'s chair')}

                                <div className="settings-section-title">Wed / Fri — No Equipment</div>
                                {renderExerciseSection('Rear Delt', 'rearDeltBw', null, 'Moved off the gym days since it needs nothing but floor space')}
                                {renderExerciseSection('Calves / Ankles', 'calf', null, 'Ankle strength — nothing else in the week trains it')}

                                <div className="settings-section-title">Corrective — Mon / Wed</div>
                                {renderExerciseSection('APT Correction', 'apt', null, 'Two fixed groups of three: group 1 on Monday, group 2 on Wednesday. Enabling a fourth in either group makes that day longer')}

                                <div className="settings-section-title">Paused</div>
                                <div className="settings-note">Reachable by the generator, but nothing is enabled — so these slots stay empty until you turn something on.</div>
                                {renderExerciseSection('Overhead Press', 'overhead', null, 'Empty pending physical therapy. Pike push-ups load the wrists; the dumbbell press is the one your thoracic outlet history argues against')}
                                {renderExerciseSection('Rear Delt — Dumbbell', 'rearDelt', null, 'Only used if Pull Track is switched to Dumbbells')}

                                <div className="settings-section-title">Archive — Not In Use</div>
                                <div className="settings-note">Read-only. The generator cannot reach any of these, so there is nothing to toggle — they are kept for reference and could be revived by pointing the program back at them.</div>
                                {renderExerciseSection('Retired Warm-Up', 'mandatory', null, 'Six exercises that ran every session. Retired to get sessions under 30 minutes; the daily stretches serve the same purpose now', { archive: true })}
                                {renderExerciseSection('Stretch Backlog — Hip Flexor', 'stretches', 'hipFlexor', null, { archive: true })}
                                {renderExerciseSection('Stretch Backlog — Hamstring', 'stretches', 'hamstring', null, { archive: true })}
                                {renderExerciseSection('Stretch Backlog — Hip / Glute', 'stretches', 'hipGlute', null, { archive: true })}
                                {renderExerciseSection('Stretch Backlog — Shoulder', 'stretches', 'shoulder', null, { archive: true })}
                                {renderExerciseSection('Stretch Backlog — Back / Spine', 'stretches', 'backSpine', null, { archive: true })}
                                {renderExerciseSection('Stretch Backlog — Full Body', 'stretches', 'fullBody', null, { archive: true })}
                            </div>

                            <div className={`tab-content ${activeTab === 'schedule' ? 'active' : ''}`}>
                                <div className="settings-section-title">Pull Track</div>
                                <div className="info-box" style={{ marginBottom: 12 }}>
                                    <div className="info-box-text">Choose which pull exercises to use. Switch when your equipment changes.</div>
                                </div>
                                <div className="track-toggle">
                                    <button className={`track-option ${exercises.pullTrack !== 'dumbbells' ? 'active' : ''}`} onClick={() => changePullTrack('bar')}>Bar / Pull-ups</button>
                                    <button className={`track-option ${exercises.pullTrack === 'dumbbells' ? 'active' : ''}`} onClick={() => changePullTrack('dumbbells')}>Dumbbells</button>
                                </div>

                                <div className="settings-section-title">Rest Credit</div>
                                <div className="info-box" style={{ marginBottom: 12 }}>
                                    <div className="info-box-text">No full rest day — Wednesday is a light recovery day instead. You get one rest credit a week, usable on any day for a genuine day off without breaking your streak. Unspent credits expire Sunday. {restCredits > 0 ? 'Available this week.' : 'Used for this week.'}</div>
                                </div>

                                <div className="settings-section-title" style={{ marginTop: 20 }}>Weekly Schedule</div>
                                <div className="info-box">
                                    <div className="info-box-text">
                                        {DAYS_OF_WEEK.map((day, i) => (
                                            <div key={i}>
                                                <strong>{day}:</strong>{' '}
                                                {getWorkoutSchedule(i).name}
                                                {isStretchDay(i) ? ' + stretches' : ' + APT'}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="settings-note">Days are fixed to fit your timetable — Legs on the late-start mornings, Pull on days with room for the trip to the bar, the shortest sessions on tight mornings. Ask to have them moved if your schedule changes.</div>
                            </div>

                            <div className={`tab-content ${activeTab === 'about' ? 'active' : ''}`}>
                                <div className="info-box">
                                    <div className="info-box-title">Workout Tracker</div>
                                    <div className="info-box-text">A progressive calisthenics tracker with automatic daily workout generation, cloud sync, and adaptive scheduling.</div>
                                </div>
                                <div className="info-box">
                                    <div className="info-box-title">How It Works</div>
                                    <div className="info-box-text">
                                        Each day generates one main lift (at your current difficulty), mandatory mobility 3× per week, 2–3 APT correction exercises, and the daily stretch routine (5 stretches, 2 × 30s each) Monday through Friday. Complete all sets to log the workout.
                                    </div>
                                </div>
                                <div className="info-box">
                                    <div className="info-box-title">Pull Track</div>
                                    <div className="info-box-text">Switch between bar pull-ups and dumbbell rows in Settings → Schedule. Enable the difficulty level you're currently working at in the Exercises list.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* History list */}
                <div className={`modal ${showHistory ? 'show' : ''}`}>
                    <div className="modal-content" style={{ height: '86vh' }}>
                        <div className="modal-header">
                            <span className="modal-title">History</span>
                            <button className="modal-close" onClick={() => setShowHistory(false)}>Done</button>
                        </div>
                        <div className="modal-scroll">
                            {history.length === 0 && <div className="empty-msg">No workouts logged yet.</div>}
                            {history.map((h, i) => (
                                <div key={i} className="history-card" onClick={() => { setViewingHistory(h); setShowHistoryDetail(true); setShowHistory(false); }}>
                                    <div className="history-date">{parseLocalDate(h.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                                    <div className="history-type">{h.workout_type} Day</div>
                                    <div className="history-count">{h.exercises.length} exercises · tap to view</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>

                {/* History detail */}
                <div className={`modal ${showHistoryDetail ? 'show' : ''}`}>
                    <div className="modal-content" style={{ height: '86vh' }}>
                        <div className="modal-header">
                            <span className="modal-title">Workout Details</span>
                            <button className="modal-close" onClick={() => { setShowHistoryDetail(false); setShowHistory(true); }}>Back</button>
                        </div>
                        <div className="modal-scroll">
                            {viewingHistory && (
                                <>
                                    <div className="info-box">
                                        <div className="info-box-title">{parseLocalDate(viewingHistory.date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</div>
                                        <div className="info-box-text">{viewingHistory.workout_type} Day · {viewingHistory.exercises.length} exercises</div>
                                    </div>
                                    {viewingHistory.exercises.map((ex, i) => (
                                        <div key={i} className={`card ${ex.isHard ? 'hard-card' : ''} done-card`} style={{ opacity: 1 }}>
                                            <div className="card-top" style={{ marginBottom: 8 }}>
                                                <div className="ex-info">
                                                    <div className="ex-name">{ex.name}</div>
                                                    <div className="ex-cat">{ex.category}</div>
                                                </div>
                                            </div>
                                            <div className={`set-section ${ex.isHard ? 'hard-section' : ''}`}>
                                                <div className={`section-label ${ex.isHard ? 'hard' : ''}`}>{ex.isHard ? 'Hard Mode' : 'Regular Mode'}</div>
                                                {ex.loggedSets.map((val, si) => (
                                                    <div key={si} className="set-row">
                                                        <span className="set-num">Set {si + 1}</span>
                                                        <span className="set-value">{val} {ex.isTime ? 'sec' : 'reps'}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </>
                            )}
                        </div>
                    </div>
                </div>

                {/* Description */}
                <div className={`modal ${showDesc ? 'show' : ''}`} onClick={() => setShowDesc(false)}>
                    <div className="desc-modal-inner" onClick={e => e.stopPropagation()}>
                        {selectedEx && (
                            <>
                                <div className="desc-name">{selectedEx.name}</div>
                                <div className="desc-text">{selectedEx.desc}</div>
                                {selectedEx.videoUrl && (
                                    <button className="desc-btn desc-video-btn" onClick={() => window.open(selectedEx.videoUrl, '_blank')}>Watch Video Tutorial</button>
                                )}
                                {selectedEx.pdfUrl && (
                                    <>
                                        <div className="pdf-note">
                                            <div className="pdf-note-label">Movement by David — Stretching Program</div>
                                            {selectedEx.pdfPage && <div className="pdf-note-page">See: {selectedEx.pdfPage}</div>}
                                        </div>
                                        <button className="desc-btn desc-pdf-btn" onClick={() => window.open(selectedEx.pdfUrl, '_blank')}>Open PDF Guide</button>
                                    </>
                                )}
                                <button className="desc-btn desc-close-btn" onClick={() => setShowDesc(false)}>Close</button>
                            </>
                        )}
                    </div>
                </div>
            </>
        );

        // ── Shared header + buttons ────────────────────────────────────────
        const header = (title, showRefresh = false) => (
            <div className="header">
                <div className="header-top">
                    <div>
                        <div className="header-day">{title}</div>
                        <div className="header-date">{date}</div>
                        <div className="header-email">{user.email}</div>
                    </div>
                    {showRefresh && (
                        <button className="refresh-btn" onClick={generateWorkout} title="Regenerate workout">↺</button>
                    )}
                </div>
                <div className="streak-chip">
                    <span className="streak-dot"></span>
                    {streak} day streak
                </div>
            </div>
        );

        const buttons = (extraBtns = null) => (
            <div className="btn-row">
                <button className="btn" onClick={() => setShowSettings(true)}>Settings</button>
                <button className="btn" onClick={() => setShowHistory(true)}>History</button>
                {extraBtns}
                <button className="btn btn-danger" onClick={handleLogout}>Logout</button>
            </div>
        );

        // ── Rest day view ──────────────────────────────────────────────────
        // Only reachable by spending this week's rest credit. There is no longer a
        // scheduled day off — the recovery day runs corrective work instead.
        if (isRest) {
            return (
                <div className="container">
                    {header('Rest Day')}
                    {buttons()}
                    <div className="center-screen">
                        <div className="center-title">{DAYS_OF_WEEK[new Date().getDay()]} — Rest Day</div>
                        <div className="center-text">Rest credit used for the week.<br />Your streak is intact — back to it tomorrow.</div>
                    </div>
                    {modals}
                </div>
            );
        }

        // ── Workout complete view ──────────────────────────────────────────
        if (workoutComplete) {
            return (
                <div className="container">
                    {header(`${dayName} Day`)}
                    {buttons()}
                    <div className="center-screen">
                        <div className="center-title">Done for Today</div>
                        <div className="center-text">Great work. Today's {dayName} session is logged.</div>
                    </div>
                    {modals}
                </div>
            );
        }

        // ── Main workout view ──────────────────────────────────────────────
        const total = workout.length + completedWorkout.length;
        const done  = completedWorkout.length;
        const pct   = total > 0 ? (done / total) * 100 : 0;

        return (
            <div className="container">
                {header(`${dayName} Day`, true)}
                {buttons(restCredits > 0
                    ? <button className="btn btn-accent" onClick={spendRestDay}>Rest Today ({restCredits})</button>
                    : null)}
                <div className="workout-list">
                    <div className="progress-wrap">
                        <div className="progress-bar-bg">
                            <div className="progress-bar-fill" style={{ width: `${pct}%` }}></div>
                        </div>
                        <div className="progress-label">{done} / {total} complete</div>
                    </div>

                    {workout.map(ex => {
                        const isHard = hardMode[ex.id];
                        const prefix = isHard ? 'hard' : 'reg';
                        const numSets = isHard ? ex.hardSets : ex.sets;
                        const reps = isHard ? ex.hardReps : ex.reps;
                        const unit = ex.isTime ? 'sec' : 'reps';
                        return (
                            <div key={ex.id} className={`card ${isHard ? 'hard-card' : ''}`}>
                                <div className="card-top">
                                    <div className="ex-info">
                                        <div className="ex-name">{ex.name}</div>
                                        <div className="ex-cat">{ex.category}</div>
                                    </div>
                                    <div className="card-right">
                                        <div className="mode-toggle">
                                            <span className={`mode-label ${!isHard ? 'mode-label-active' : ''}`}>Reg</span>
                                            <div className={`toggle-switch ${isHard ? 'on' : ''}`} onClick={() => toggleHardMode(ex.id)}></div>
                                            <span className={`mode-label ${isHard ? 'mode-label-active' : ''}`}>Hard</span>
                                        </div>
                                        <button className="detail-btn" onClick={() => { setSelectedEx(ex); setShowDesc(true); }}>Details</button>
                                    </div>
                                </div>
                                <div className={`set-section ${isHard ? 'hard-section' : ''}`}>
                                    <div className={`section-label ${isHard ? 'hard' : ''}`}>{numSets} sets × {reps} {unit}{ex.rampUp ? ' + warm-up' : ''}{isHard ? ' — Hard Mode' : ''}</div>
                                    {ex.rampUp && (
                                        <div className="set-row rampup-row">
                                            <span className="set-num">Warm-up</span>
                                            <input
                                                type="number"
                                                className="set-input"
                                                placeholder={`~${rampUpReps(ex, isHard)} easy`}
                                                value={log[`${ex.id}-${prefix}-w`] || ''}
                                                onChange={e => logRep(ex.id, `${prefix}-w`, e.target.value)}
                                            />
                                        </div>
                                    )}
                                    {Array.from({ length: numSets }).map((_, i) => (
                                        <div key={i} className="set-row">
                                            <span className="set-num">Set {i + 1}</span>
                                            <input
                                                type="number"
                                                className="set-input"
                                                placeholder={unit}
                                                value={log[`${ex.id}-${prefix}-${i}`] || ''}
                                                onChange={e => logRep(ex.id, `${prefix}-${i}`, e.target.value)}
                                            />
                                        </div>
                                    ))}
                                </div>
                                <button
                                    className={`complete-btn ${isHard ? 'hard' : ''}`}
                                    disabled={!isComplete(ex)}
                                    onClick={() => completeExercise(ex)}
                                >
                                    {isComplete(ex) ? 'Mark Complete' : 'Fill All Sets to Complete'}
                                </button>
                            </div>
                        );
                    })}

                    {completedWorkout.length > 0 && (
                        <>
                            <div className="completed-divider">
                                <span className="completed-divider-text">Completed — {done} of {total}</span>
                            </div>
                            {completedWorkout.map(ex => {
                                const isHard = hardMode[ex.id];
                                const prefix = isHard ? 'hard' : 'reg';
                                const numSets = isHard ? ex.hardSets : ex.sets;
                                return (
                                    <div key={ex.id} className="card done-card">
                                        <div className="card-top" style={{ marginBottom: 8 }}>
                                            <div className="ex-info">
                                                <div className={`ex-name ex-name-done`}>{ex.name}</div>
                                                <div className="ex-cat">{ex.category}</div>
                                            </div>
                                            <span className="done-check">✓</span>
                                        </div>
                                        <div className={`set-section ${isHard ? 'hard-section' : ''}`}>
                                            <div className={`section-label ${isHard ? 'hard' : ''}`}>{isHard ? 'Hard Mode' : 'Regular Mode'}</div>
                                            {ex.rampUp && (
                                                <div className="set-row rampup-row">
                                                    <span className="set-num">Warm-up</span>
                                                    <span className="set-value">{log[`${ex.id}-${prefix}-w`]} {ex.isTime ? 'sec' : 'reps'}</span>
                                                </div>
                                            )}
                                            {Array.from({ length: numSets }).map((_, i) => (
                                                <div key={i} className="set-row">
                                                    <span className="set-num">Set {i + 1}</span>
                                                    <span className="set-value">{log[`${ex.id}-${prefix}-${i}`]} {ex.isTime ? 'sec' : 'reps'}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </>
                    )}
                </div>
                {modals}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
