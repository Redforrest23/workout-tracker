name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 12:00 UTC — well within Supabase's 1-week inactivity window
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          response=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "https://gnxwcdwqmderpghmtddy.supabase.co/rest/v1/user_profiles?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdueHdjZHdxbWRlcnBnaG10ZGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NTQwODcsImV4cCI6MjA3NzAzMDA4N30.NCxKQvkvAuRlaAWR9FdYR9Or15qYyG2V69H-EeJU7pA" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdueHdjZHdxbWRlcnBnaG10ZGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NTQwODcsImV4cCI6MjA3NzAzMDA4N30.NCxKQvkvAuRlaAWR9FdYR9Or15qYyG2V69H-EeJU7pA")
          echo "Supabase responded with HTTP $response"
          cat /tmp/resp.txt
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Unexpected response — project may be paused, unreachable, or the key is invalid"
            exit 1
          fi
          echo "Supabase project is active"

      - name: Record ping (keeps repo active so GitHub doesn't disable this schedule after 60 days)
        run: |
          mkdir -p keepalive
          echo "Last successful Supabase ping: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > keepalive/last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keepalive/last-ping.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: record keep-alive ping"
            git push
          fi
